<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Popup</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div class="chat-container">


        <!-- Chat popup button -->
        <div class="chat-popup" onclick="toggleChat()">
            <img src="./icons/chat-icon.svg" alt="Chat Icon" width="35" height="35">
        </div>

        <!-- Chat window that expands upward -->
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <img src="./icons/chat-logo.png" alt="chat logo" class="chat-logo">
                <button onclick="toggleChat()" class="x-button">×</button>
            </div>

            <!-- chat body section -->
            <div class="chat-body" id="chatBody">
                <div id="tab-content-1" class="tab-content active-content">
                    <p class="hello-text">Hello there.<br>How can we help?</p>
                    <div class="messages-area">
                        <p style="color: #888;">Recent updates will appear here.</p>
                    </div>
                </div>

                <div id="tab-content-2" class="tab-content">
                    <div id="message-status">
                        <div class="message-container">
                            <!-- bouncing dots-->
                            <div class="bouncing-dots" id="bouncing-dots">
                                <span>•</span><span>•</span><span>•</span>
                            </div>
                        </div>
                    </div>
                </div>


                <div id="tab-content-3" class="tab-content">
                    <h3 style="color: white;">Help Center</h3>
                    <p class="message-status" style="color: #888;">Search our articles or start a chat.</p>
                </div>

                <div id="tab-content-4" class="tab-content">
                    <h3 style="color: white;">Latest News</h3>
                    <p class="message-status">Check out our new version 2.0 release!</p>
                </div>
            </div>
